services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: docuflow-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-DocuFlow_Dev_Pass123!}"
      MSSQL_PID: "Developer"
    ports:
      - "${SQL_SERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-DocuFlow_Dev_Pass123!}\" -C -Q \"SELECT 1\" || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - docuflow-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: docuflow-azurite
    restart: unless-stopped
    command: "azurite --skipApiVersionCheck --blobHost 0.0.0.0 --blobPort 10000 --queueHost 0.0.0.0 --queuePort 10001 --tableHost 0.0.0.0 --tablePort 10002 --location /data --debug /data/debug.log"
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000" # Blob Service
      - "${AZURITE_QUEUE_PORT:-10001}:10001" # Queue Service
      - "${AZURITE_TABLE_PORT:-10002}:10002" # Table Service
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10000,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docuflow-network

volumes:
  sqlserver_data:
    name: docuflow_sqlserver_data
  azurite_data:
    name: docuflow_azurite_data

networks:
  docuflow-network:
    name: docuflow_network
    driver: bridge

