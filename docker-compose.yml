services:
  postgres:
    image: postgres:17.2-alpine
    container_name: docuflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-docuflow}"
      POSTGRES_USER: "${POSTGRES_USER:-docuflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-docuflow} -d $${POSTGRES_DB:-docuflow}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - docuflow-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: docuflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:5000"
      POSTGRES_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-docuflow};Username=${POSTGRES_USER:-docuflow};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      DOCUMENT_STORAGE_PATH: "/data/storage"
      DOCUMENT_STORAGE_CONTAINER: "${DOCUMENT_STORAGE_CONTAINER:-documents}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env (min 32 chars)}"
      JWT_ISSUER: "${JWT_ISSUER:-DocuFlow.Api}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-DocuFlow.Client}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-8080}}"
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
      Gemini__Model: "${GEMINI_MODEL:-gemini-3.5-flash}"
    volumes:
      - document_storage:/data/storage
    ports:
      - "${PORT:-5000}:5000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1:5000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - docuflow-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: docuflow-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      POSTGRES_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-docuflow};Username=${POSTGRES_USER:-docuflow};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      DOCUMENT_STORAGE_PATH: "/data/storage"
      DOCUMENT_STORAGE_CONTAINER: "${DOCUMENT_STORAGE_CONTAINER:-documents}"
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
      Gemini__Model: "${GEMINI_MODEL:-gemini-3.5-flash}"
    volumes:
      - document_storage:/data/storage
    networks:
      - docuflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
    container_name: docuflow-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - docuflow-network

volumes:
  postgres_data:
    name: docuflow_postgres_data
  document_storage:
    name: docuflow_document_storage

networks:
  docuflow-network:
    name: docuflow_network
    driver: bridge
